<svg viewBox="0 0 620 660" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <radialGradient id="retroGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2E92" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF2E92" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="retroShield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A2668"/>
      <stop offset="100%" stop-color="#1A1030"/>
    </linearGradient>
    <linearGradient id="retroBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241645"/>
      <stop offset="100%" stop-color="#150C29"/>
    </linearGradient>
    <clipPath id="retroCardClip"><rect x="14" y="14" width="592" height="632"/></clipPath>
  </defs>

  <!-- background -->
  <rect x="14" y="14" width="592" height="632" fill="url(#retroBg)"/>

  <g clip-path="url(#retroCardClip)">
    <!-- starburst rays -->
    <g stroke-width="10" opacity="0.35">
      <g stroke="#FF2E92">
        <line x1="310" y1="155" x2="530" y2="30"/>
        <line x1="310" y1="155" x2="530" y2="280"/>
        <line x1="310" y1="155" x2="90" y2="280"/>
      </g>
      <g stroke="#00F0FF">
        <line x1="310" y1="155" x2="150" y2="-20"/>
        <line x1="310" y1="155" x2="470" y2="-20"/>
        <line x1="310" y1="155" x2="90" y2="30"/>
        <line x1="310" y1="155" x2="500" y2="290"/>
      </g>
    </g>
    <!-- scanlines -->
    <g stroke="#000000" stroke-opacity="0.15">
      <path d="M14,50 H606"/><path d="M14,80 H606"/><path d="M14,110 H606"/><path d="M14,140 H606"/>
      <path d="M14,170 H606"/><path d="M14,200 H606"/><path d="M14,230 H606"/><path d="M14,260 H606"/>
      <path d="M14,290 H606"/><path d="M14,320 H606"/><path d="M14,350 H606"/><path d="M14,380 H606"/>
      <path d="M14,410 H606"/><path d="M14,440 H606"/><path d="M14,470 H606"/><path d="M14,500 H606"/>
    </g>
  </g>

  <g>
    <rect x="14" y="14" width="16" height="16" fill="#FF2E92"/><rect x="30" y="14" width="16" height="16" fill="#00F0FF"/>
    <rect x="590" y="14" width="16" height="16" fill="#FF2E92"/><rect x="574" y="14" width="16" height="16" fill="#00F0FF"/>
    <rect x="14" y="630" width="16" height="16" fill="#FF2E92"/><rect x="30" y="630" width="16" height="16" fill="#00F0FF"/>
    <rect x="590" y="630" width="16" height="16" fill="#FF2E92"/><rect x="574" y="630" width="16" height="16" fill="#00F0FF"/>
  </g>
  <rect x="14" y="14" width="592" height="632" fill="none" stroke="#00F0FF" stroke-width="3"/>

  <!-- eyebrow -->
  <text x="310" y="49" text-anchor="middle" font-size="13" letter-spacing="2" fill="#FFD873" font-weight="bold">ACHIEVEMENT UNLOCKED</text>

  <!-- glow + shield -->
  <circle cx="310" cy="160" r="150" fill="url(#retroGlow)"/>
  <path d="M310,60 L385,90 L385,169 C385,211 350,239 310,257 C270,239 235,211 235,169 L235,90 Z"
        fill="url(#retroShield)" stroke="#00F0FF" stroke-width="3.5"/>
  <path d="M269,174 L294,197 L348,143" fill="none" stroke="#FF2E92" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- event title block -->
  <text x="310" y="297" text-anchor="middle" font-size="24" letter-spacing="1" fill="#00F0FF" font-weight="bold">COMMIT &amp; SECURE</text>
  <text x="310" y="322" text-anchor="middle" font-size="14" fill="#FF2E92">Git &amp; GitHub Basics</text>
  <text x="310" y="342" text-anchor="middle" font-size="12" fill="#D9CBEE">By OWASP JIS University, 2026</text>

  <line x1="180" y1="362" x2="440" y2="362" stroke="#4A3878" stroke-width="1.5"/>

  <!-- name -->
  <text x="310" y="408" text-anchor="middle" font-size="30" fill="#FFD873" font-weight="bold"
        textLength="420" lengthAdjust="spacingAndGlyphs">{name}</text>
  <!-- github handle -->
  <text x="310" y="435" text-anchor="middle" font-size="16" fill="#D9CBEE"
        textLength="280" lengthAdjust="spacingAndGlyphs">PLAYER: @{github}</text>

  <!-- role tag -->
  <rect x="188" y="456" width="244" height="32" fill="#1A1030" stroke="#FF2E92" stroke-width="2"/>
  <text x="310" y="477" text-anchor="middle" font-size="13" fill="#FF2E92">LEVEL: GitHub Contributor</text>

  <!-- supporting line -->
  <text x="310" y="516" text-anchor="middle" font-size="13" fill="#00F0FF">Git + GitHub Pages + PR Completed</text>

  <!-- checkerboard footer strip -->
  <g clip-path="url(#retroCardClip)">
    <g>
      <rect x="14" y="614" width="592" height="18" fill="#1A1030"/>
      <g fill="#00F0FF" opacity="0.55">
        <rect x="14" y="614" width="18" height="18"/><rect x="50" y="614" width="18" height="18"/>
        <rect x="86" y="614" width="18" height="18"/><rect x="122" y="614" width="18" height="18"/>
        <rect x="158" y="614" width="18" height="18"/><rect x="194" y="614" width="18" height="18"/>
        <rect x="230" y="614" width="18" height="18"/><rect x="266" y="614" width="18" height="18"/>
        <rect x="302" y="614" width="18" height="18"/><rect x="338" y="614" width="18" height="18"/>
        <rect x="374" y="614" width="18" height="18"/><rect x="410" y="614" width="18" height="18"/>
        <rect x="446" y="614" width="18" height="18"/><rect x="482" y="614" width="18" height="18"/>
        <rect x="518" y="614" width="18" height="18"/><rect x="554" y="614" width="18" height="18"/>
        <rect x="590" y="614" width="18" height="18"/>
      </g>
      <g fill="#FF2E92" opacity="0.55">
        <rect x="32" y="614" width="18" height="18"/><rect x="68" y="614" width="18" height="18"/>
        <rect x="104" y="614" width="18" height="18"/><rect x="140" y="614" width="18" height="18"/>
        <rect x="176" y="614" width="18" height="18"/><rect x="212" y="614" width="18" height="18"/>
        <rect x="248" y="614" width="18" height="18"/><rect x="284" y="614" width="18" height="18"/>
        <rect x="320" y="614" width="18" height="18"/><rect x="356" y="614" width="18" height="18"/>
        <rect x="392" y="614" width="18" height="18"/><rect x="428" y="614" width="18" height="18"/>
        <rect x="464" y="614" width="18" height="18"/><rect x="500" y="614" width="18" height="18"/>
        <rect x="536" y="614" width="18" height="18"/><rect x="572" y="614" width="18" height="18"/>
      </g>
    </g>
  </g>
</svg>
