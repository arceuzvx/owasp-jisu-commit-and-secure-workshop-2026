<svg viewBox="0 0 620 660" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="corpGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0A66C2" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0A66C2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="corpShield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A4E85"/>
      <stop offset="100%" stop-color="#08203D"/>
    </linearGradient>
    <pattern id="corpDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#0A66C2" opacity="0.10"/>
    </pattern>
    <clipPath id="corpCardClip"><rect x="14" y="14" width="592" height="632" rx="18"/></clipPath>
  </defs>

  <!-- background -->
  <rect x="14" y="14" width="592" height="632" rx="18" fill="#FFFFFF" stroke="#0A66C2" stroke-width="1.5"/>
  <rect x="14" y="14" width="592" height="632" rx="18" fill="url(#corpDots)"/>
  <rect x="14" y="14" width="592" height="7" fill="#0A66C2"/>
  <rect x="14" y="639" width="592" height="7" fill="#0A66C2"/>

  <!-- corner ribbon -->
  <g clip-path="url(#corpCardClip)">
    <g transform="translate(14,14) rotate(-45 60 60)">
      <rect x="-40" y="46" width="220" height="30" fill="#0A66C2"/>
      <text x="70" y="67" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="bold" letter-spacing="1">VERIFIED</text>
    </g>
  </g>

  <!-- glow -->
  <circle cx="310" cy="155" r="150" fill="url(#corpGlow)"/>

  <!-- shield -->
  <path d="M310,55 L385,85 L385,164 C385,206 350,234 310,252 C270,234 235,206 235,164 L235,85 Z"
        fill="url(#corpShield)" stroke="#0A66C2" stroke-width="2.5"/>
  <path d="M310,63 L378,89 L378,163 C378,199 347,224 310,241 C273,224 242,199 242,163 L242,89 Z"
        fill="none" stroke="#4C9AE0" stroke-width="1"/>
  <path d="M269,169 L294,192 L348,138" fill="none" stroke="#FFFFFF" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- event title block -->
  <text x="310" y="292" text-anchor="middle" font-size="25" letter-spacing="2" fill="#0A2540" font-weight="bold">COMMIT &amp; SECURE</text>
  <text x="310" y="317" text-anchor="middle" font-size="15" fill="#3A6EA8">Git &amp; GitHub Basics</text>
  <text x="310" y="337" text-anchor="middle" font-size="12" fill="#5A6B7B">By OWASP JIS University, 2026</text>

  <line x1="180" y1="358" x2="440" y2="358" stroke="#DCE6F0" stroke-width="1"/>

  <!-- name -->
  <text x="310" y="404" text-anchor="middle" font-size="32" fill="#0A2540" font-weight="bold"
        textLength="420" lengthAdjust="spacingAndGlyphs">{name}</text>
  <!-- github handle -->
  <text x="310" y="431" text-anchor="middle" font-size="16" fill="#0A66C2"
        textLength="280" lengthAdjust="spacingAndGlyphs">@{github}</text>

  <!-- role pill -->
  <rect x="198" y="452" width="224" height="32" rx="16" fill="#0A66C2"/>
  <text x="310" y="473" text-anchor="middle" font-size="13" letter-spacing="0.5" fill="#FFFFFF" font-weight="bold">GitHub Contributor</text>

  <!-- supporting line -->
  <text x="310" y="512" text-anchor="middle" font-size="13" fill="#5A6B7B">Git + GitHub Pages + PR Completed</text>

  <!-- medal ribbon tails -->
  <path d="M282,522 L282,570 L310,550 Z" fill="#0847A6"/>
  <path d="M338,522 L338,570 L310,550 Z" fill="#0A66C2"/>
</svg>
