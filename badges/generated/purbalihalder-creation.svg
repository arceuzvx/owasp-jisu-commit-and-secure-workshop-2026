<svg viewBox="0 0 620 660" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace">
  <defs>
    <radialGradient id="hackerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39FF88" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#39FF88" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hackerShield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#123A22"/>
      <stop offset="100%" stop-color="#08130D"/>
    </linearGradient>
    <pattern id="hackerGrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34,0 H0 V34" fill="none" stroke="#2BE07A" stroke-width="0.6" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect x="14" y="14" width="592" height="632" rx="16" fill="#060A08" stroke="#2BE07A" stroke-width="1.5"/>
  <rect x="14" y="14" width="592" height="632" rx="16" fill="url(#hackerGrid)"/>

  <!-- circuit traces -->
  <g stroke="#2BE07A" stroke-width="2" fill="none" opacity="0.55">
    <path d="M14,120 H90 V60"/>
    <path d="M14,470 H70 V560 H130"/>
    <path d="M606,150 H520 V70"/>
    <path d="M606,500 H540 V590 H480"/>
  </g>
  <g fill="#2BE07A" opacity="0.7">
    <circle cx="90" cy="60" r="4"/><circle cx="130" cy="560" r="4"/>
    <circle cx="520" cy="70" r="4"/><circle cx="480" cy="590" r="4"/>
  </g>

  <!-- binary strips -->
  <g fill="#2BE07A" opacity="0.14" font-size="11">
    <text x="24" y="200">01</text><text x="24" y="216">10</text><text x="24" y="232">11</text>
    <text x="24" y="248">00</text><text x="24" y="264">01</text><text x="24" y="280">10</text>
    <text x="580" y="380">10</text><text x="580" y="396">01</text><text x="580" y="412">00</text>
    <text x="580" y="428">11</text><text x="580" y="444">10</text><text x="580" y="460">01</text>
  </g>

  <!-- corner brackets -->
  <path d="M30,54 V30 H54" fill="none" stroke="#2BE07A" stroke-width="2"/>
  <path d="M566,30 H590 V54" fill="none" stroke="#2BE07A" stroke-width="2"/>
  <path d="M30,606 V630 H54" fill="none" stroke="#2BE07A" stroke-width="2"/>
  <path d="M590,606 V630 H566" fill="none" stroke="#2BE07A" stroke-width="2"/>

  <!-- glow + node lines into shield -->
  <circle cx="310" cy="155" r="150" fill="url(#hackerGlow)"/>
  <g stroke="#2BE07A" stroke-width="1.5" opacity="0.6">
    <path d="M235,110 H190"/><path d="M385,110 H430"/>
  </g>
  <circle cx="190" cy="110" r="3.5" fill="#2BE07A"/>
  <circle cx="430" cy="110" r="3.5" fill="#2BE07A"/>

  <!-- shield -->
  <path d="M310,55 L385,85 L385,164 C385,206 350,234 310,252 C270,234 235,206 235,164 L235,85 Z"
        fill="url(#hackerShield)" stroke="#39FF88" stroke-width="3.5"/>
  <path d="M269,169 L294,192 L348,138" fill="none" stroke="#39FF88" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- event title block, glitch layered -->
  <text x="308" y="292" text-anchor="middle" font-size="24" letter-spacing="1" fill="#FF2E92" opacity="0.5">&gt; COMMIT &amp; SECURE</text>
  <text x="312" y="292" text-anchor="middle" font-size="24" letter-spacing="1" fill="#00F0FF" opacity="0.5">&gt; COMMIT &amp; SECURE</text>
  <text x="310" y="292" text-anchor="middle" font-size="24" letter-spacing="1" fill="#39FF88" font-weight="bold">&gt; COMMIT &amp; SECURE</text>
  <text x="310" y="317" text-anchor="middle" font-size="14" fill="#5FEFA3">Git &amp; GitHub Basics</text>
  <text x="310" y="337" text-anchor="middle" font-size="12" fill="#2BE07A" opacity="0.8">// by OWASP JIS University, 2026</text>

  <line x1="180" y1="358" x2="440" y2="358" stroke="#1C4030" stroke-width="1.5"/>

  <!-- name -->
  <text x="310" y="404" text-anchor="middle" font-size="30" fill="#4CFFA0" font-weight="bold"
        textLength="420" lengthAdjust="spacingAndGlyphs">Purbali Halder</text>
  <!-- github handle -->
  <text x="310" y="431" text-anchor="middle" font-size="16" fill="#7CDBA6"
        textLength="280" lengthAdjust="spacingAndGlyphs">USER: @purbalihalder-creation</text>

  <!-- role tag -->
  <rect x="188" y="452" width="244" height="32" rx="4" fill="#0A1712" stroke="#2BE07A" stroke-width="1.3"/>
  <text x="310" y="473" text-anchor="middle" font-size="13" fill="#5FEFA3">ROLE: GitHub Contributor</text>

  <!-- supporting line -->
  <text x="310" y="512" text-anchor="middle" font-size="13" fill="#2BE07A">[OK] Git + GitHub Pages + PR Completed</text>

  <!-- cursor blink -->
  <rect x="305.5" y="530" width="9" height="14" fill="#2BE07A">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
